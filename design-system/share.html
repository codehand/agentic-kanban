<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Served at /s/<token> (TASK-076): read-only view of ONE shared task.
     Needs no kanban_token and deliberately does NOT load /api.js, so it never
     redirects to signin.html, never opens /api/stream and never calls any
     /api/* other than GET /api/share/<token>. -->
<base href="/" />
<meta name="referrer" content="no-referrer" />
<title>Agentic Kanban - Shared task</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css" />
</head>

<body class="font-sans text-text antialiased h-screen overflow-hidden" data-active="board">

<div class="flex h-full">

  <!-- ============ LEFT RAIL (injected by shell.js, then disabled) ============ -->
  <aside id="rail"></aside>

  <!-- ============ MAIN ============ -->
  <main class="flex-1 min-w-0 flex flex-col">

    <!-- top bar -->
    <header class="h-14 shrink-0 border-b border-border bg-panel/80 backdrop-blur flex items-center gap-3 px-4">
      <button type="button" disabled aria-disabled="true" class="lg:hidden grid place-items-center w-8 h-8 rounded-md text-muted opacity-60 cursor-not-allowed" aria-label="Open navigation"><i class="ph ph-list text-[19px]"></i></button>
      <a id="back-to-board" role="link" aria-disabled="true" class="flex items-center gap-1.5 rounded-md px-2 h-8 text-[13px] text-muted opacity-60 cursor-not-allowed shrink-0"><i class="ph ph-arrow-left text-[15px]"></i> Board</a>
      <span class="w-px h-4 bg-border shrink-0" aria-hidden="true"></span>
      <div class="flex items-center gap-2 min-w-0">
        <span id="topbar-project" class="text-[15px] font-semibold tracking-tight truncate">&hellip;</span>
        <span class="text-muted text-[13px] hidden sm:inline">Shared task</span>
      </div>

      <div class="ml-auto flex items-center gap-2">
        <button id="theme-toggle" aria-label="Toggle theme" class="grid place-items-center w-9 h-9 rounded-md border border-border bg-panel2 text-muted hover:text-text" title="Toggle theme">
          <i class="ph ph-moon text-[16px]"></i>
        </button>
      </div>
    </header>

    <div class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden">
      <!-- loading / denied / error -->
      <div id="task-loading" class="grid place-items-center py-24 text-muted text-[14px]"><span class="flex items-center gap-2"><i class="ph ph-spinner animate-spin text-[17px]"></i> Loading shared task&hellip;</span></div>
      <div id="share-denied" class="hidden grid place-items-center py-24 px-4">
        <div class="text-center max-w-sm">
          <span class="inline-grid place-items-center w-11 h-11 rounded-xl bg-st_reject/15 text-st_reject"><i class="ph-fill ph-lock-key text-[22px]"></i></span>
          <p class="mt-3 text-[16px] font-semibold">Access denied</p>
          <p id="share-denied-msg" class="text-muted text-[13px] mt-1">This link has expired or you don't have permission to view it. Contact your admin.</p>
        </div>
      </div>
      <div id="task-error" class="hidden grid place-items-center py-24 px-4">
        <div class="text-center">
          <p class="text-ev_fail text-[16px] font-semibold">Could not load shared task</p>
          <p id="task-error-msg" class="text-muted text-[13px] mt-1 break-words"></p>
        </div>
      </div>

      <!-- ============ TASK DETAIL (read-only) ============ -->
      <article id="task-detail" class="hidden mx-auto w-full max-w-4xl px-4 sm:px-6 py-6 break-words">
        <div id="share-banner" role="status" class="mb-4 flex items-center gap-2 rounded-lg border border-accent/30 bg-accent/10 px-3 py-2 text-[13px]">
          <i class="ph ph-eye text-[16px] text-accent"></i>
          <span>Read-only shared view &middot; <span id="share-expiry"></span></span>
        </div>
        <div class="border-b border-border pb-3">
          <div class="flex items-center gap-2 flex-wrap">
            <span id="task-key" class="mono text-[13px] text-muted"></span>
            <span id="task-state-badge" class="inline-flex items-center gap-1 mono text-[13px] px-1.5 py-0.5 rounded"></span>
          </div>
          <h1 id="task-title" class="mt-1.5 text-[22px] font-semibold leading-tight tracking-tight"></h1>
          <p class="mt-1 text-[13px] text-muted">in <span id="task-project" class="text-text"></span> &middot; updated <span id="task-updated" class="mono"></span></p>

          <!-- actions: same state gating as task.html, always disabled here -->
          <div class="flex items-center gap-2 flex-wrap pt-3">
            <button id="btn-approve" type="button" disabled aria-disabled="true" class="hidden flex items-center gap-2 rounded-md bg-st_human px-3.5 h-9 text-[14px] font-semibold text-white opacity-40 cursor-not-allowed">
              <i class="ph-fill ph-check-circle text-[16px]"></i> Approve &rarr; Done
            </button>
            <button id="btn-reject" type="button" disabled aria-disabled="true" class="hidden flex items-center gap-2 rounded-md border border-st_reject/40 bg-panel2 px-3.5 h-9 text-[14px] font-semibold text-st_reject opacity-40 cursor-not-allowed">
              <i class="ph-fill ph-x-circle text-[16px]"></i> Reject
            </button>
            <button id="btn-reset" type="button" disabled aria-disabled="true" class="hidden flex items-center gap-1.5 rounded-md border border-border bg-panel2 px-3 h-9 text-[13px] text-muted opacity-40 cursor-not-allowed">
              <i class="ph ph-arrow-counter-clockwise text-[15px]"></i> Reset
            </button>
          </div>
        </div>

        <div id="task-body" class="py-5 space-y-5 text-[14px]"></div>
      </article>
    </div>
  </main>
</div>

<script src="/shell.js"></script>
<script src="/md.js"></script>
<script src="/drawer-sections.js"></script>
<script>
  /* share.html — read-only viewer for /s/<token> (TASK-076). Renders the same
   * sections as task.html via drawer-sections.js, then disables every control
   * that could navigate or write. Access is decided by the SERVER on every
   * load (GET /api/share/<token> -> 404 once expired); the client timer below
   * only swaps the page to the denied state when expires_at passes while it
   * is open. */
  (function () {
    'use strict';
    var S = window.__drawerSections;
    var DENIED_TITLE = 'Access denied · Agentic Kanban';
    var expiryTimer = null;

    function relTime(iso) {
      if (!iso) return '';
      var d = new Date(iso), now = new Date(), s = Math.floor((now - d) / 1000);
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }

    function show(id) {
      ['task-loading', 'share-denied', 'task-error', 'task-detail'].forEach(function (x) {
        var el = document.getElementById(x);
        if (el) el.classList.toggle('hidden', x !== id);
      });
    }

    /* Make a subtree inert: every internal link loses its href (role=link +
     * aria-disabled so it still reads as a disabled link), every form control
     * is disabled. External http(s) links opening in a new tab (PR/MR, docs)
     * stay usable. */
    function lockDown(root) {
      Array.prototype.forEach.call(root.querySelectorAll('a'), function (a) {
        var href = a.getAttribute('href') || '';
        if (/^https?:\/\//i.test(href) && a.getAttribute('target') === '_blank') return;
        a.removeAttribute('href');
        a.setAttribute('role', 'link');
        a.setAttribute('aria-disabled', 'true');
        a.setAttribute('tabindex', '-1');
        a.classList.add('opacity-60', 'cursor-not-allowed');
      });
      Array.prototype.forEach.call(root.querySelectorAll('button, textarea, input, select'), function (el) {
        el.disabled = true;
        el.setAttribute('aria-disabled', 'true');
      });
    }

    // Belt and braces: nothing marked disabled may navigate or react.
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (t && typeof t.closest === 'function' && t.closest('[aria-disabled="true"]')) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    function setRailProject(slug) {
      var label = document.getElementById('project-switcher-label');
      var btn = document.getElementById('project-switcher');
      if (label) label.textContent = slug;
      if (btn) btn.setAttribute('aria-label', 'Switch project: ' + slug);
    }

    /* Denied: drop every piece of task content from the DOM, not just hide it. */
    function deny() {
      if (expiryTimer) { clearInterval(expiryTimer); expiryTimer = null; }
      var detail = document.getElementById('task-detail');
      if (detail) detail.remove();
      document.getElementById('topbar-project').textContent = '—';
      setRailProject('—');
      document.title = DENIED_TITLE;
      show('share-denied');
    }

    function render(res) {
      var t = res.task;
      var project = String(res.project || '');
      document.title = t.key + ' · ' + t.title;
      document.getElementById('topbar-project').textContent = project;
      setRailProject(project);
      document.getElementById('task-key').textContent = t.key;
      document.getElementById('task-title').textContent = t.title;
      document.getElementById('task-project').textContent = project;
      document.getElementById('task-updated').textContent = relTime(t.updated_at);
      document.getElementById('share-expiry').textContent = res.expires_at
        ? 'Expires ' + new Date(res.expires_at).toLocaleString()
        : 'Never expires';
      var st = S.stateLabel(t.state);
      var badge = document.getElementById('task-state-badge');
      badge.className = 'inline-flex items-center gap-1 mono text-[13px] px-1.5 py-0.5 rounded ' + st.cls;
      var icon = document.createElement('i');
      icon.className = 'ph' + (st.fill ? '-fill' : '') + ' ' + st.icon + ' text-[13px]';
      badge.replaceChildren(icon, document.createTextNode(st.text));
      S.showActions(t.state);

      // Same renderers as task.html (they escape all task data).
      var html = '';
      html += S.renderAttributes(t);
      html += S.renderSpec(t);
      html += S.renderDependsOn(project, t.depends_on);
      html += S.renderGitrefs(res.gitrefs);
      html += S.renderEvidence(res.evidence, '/' + encodeURIComponent(project) + '/evidence.html#' + encodeURIComponent(t.key));
      html += S.renderTimeline(res.timeline || []);
      html += S.renderComments(res.comments || []);
      var body = document.getElementById('task-body');
      body.innerHTML = html;
      lockDown(body); // Edit attributes, composer, depends-on + evidence links
      show('task-detail');

      if (res.expires_at) {
        var expMs = Date.parse(res.expires_at);
        var check = function () { if (Date.now() >= expMs) deny(); };
        expiryTimer = setInterval(check, 1000);
        check();
      }
    }

    // --- Init ---
    lockDown(document.getElementById('rail')); // menu, project switcher, "Awaiting You"
    setRailProject('—');
    var m = location.pathname.match(/^\/s\/([^/.]+)$/);
    if (!m) { deny(); return; }

    // Plain fetch, no Authorization header: the link token is the only grant.
    fetch('/api/share/' + m[1], { credentials: 'omit', cache: 'no-store' }).then(function (r) {
      if (r.status === 404) { deny(); return null; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (res) {
      if (!res) return;
      if (!res.task) { deny(); return; }
      render(res);
    }).catch(function (err) {
      document.getElementById('task-error-msg').textContent = String(err && err.message || err);
      show('task-error');
    });
  })();
</script>
</body>
</html>
