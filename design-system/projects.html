<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agentic Kanban - Projects</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css" />
</head>

<body class="font-sans text-text antialiased h-screen overflow-hidden" data-active="projects">
<div class="flex h-full">
  <aside id="rail"></aside>

  <main class="flex-1 min-w-0 flex flex-col">
    <!-- top bar -->
    <header class="h-14 shrink-0 border-b border-border bg-panel/80 backdrop-blur flex items-center gap-3 px-4">
      <span class="text-[15px] font-semibold tracking-tight">Projects</span>
      <div class="ml-auto flex items-center gap-2">
        <div class="hidden md:flex items-center gap-2 rounded-md border border-border bg-panel2 px-2.5 h-9 w-56 text-muted focus-within:border-accent/60">
          <i class="ph ph-magnifying-glass text-[16px]"></i>
          <input id="project-search" name="project-search" aria-label="Search projects" placeholder="Search projects" class="bg-transparent text-[13px] text-text placeholder:text-muted outline-none w-full" />
        </div>
        <a href="new-task.html" class="flex items-center gap-1.5 rounded-md bg-accent px-3 h-9 text-[13px] font-medium text-white hover:bg-accent/90 active:translate-y-px">
          <i class="ph ph-plus text-[15px]"></i> New Task
        </a>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto console-grid">
      <div class="max-w-[1100px] mx-auto px-6 py-6">

        <!-- across-all hero strip -->
        <a href="index.html#col-human" class="block rounded-xl border border-st_human/40 bg-st_human/10 glow-human-soft px-5 py-4 hover:bg-st_human/15">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-[18px] font-semibold text-st_human flex items-center gap-2"><i class="ph-fill ph-hand-tap"></i> 2 tasks awaiting you</p>
              <p class="mt-0.5 text-[13px] text-muted">Across all projects. These are cleared by the gate and only you can mark them Done.</p>
            </div>
            <span class="hidden sm:flex items-center gap-1 text-[13px] text-st_human">Review now <i class="ph ph-arrow-right"></i></span>
          </div>
        </a>

        <h2 id="projects-heading" class="mt-7 mb-3 text-[13px] uppercase tracking-wider text-muted">Loading projects&hellip;</h2>

        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- populated by live data from /api/projects -->
        </div>

        <form id="add-project-form" class="mt-4 hidden max-w-[360px]">
          <label for="field-project-name" class="text-[13px] text-muted">Project name</label>
          <input id="field-project-name" name="project-name" placeholder="my-project" autocomplete="off"
            class="mt-1 w-full rounded-md border border-border bg-panel2 px-2.5 py-2 text-[13px] text-text placeholder:text-muted outline-none focus:border-accent/60" />
          <p id="add-project-error" class="hidden mt-1.5 text-[13px] text-ev_fail"></p>
          <button type="submit" id="btn-add-project-submit"
            class="mt-2.5 w-full flex items-center justify-center gap-1.5 rounded-md bg-accent px-4 h-10 text-[14px] font-semibold text-white hover:bg-accent/90 active:translate-y-px">
            <i class="ph ph-check text-[16px]"></i> Create project
          </button>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="/api.js"></script>
<script>
  /* projects.js — Live data wiring for projects page. Fetches from /api/projects. */
  (function () {
    'use strict';
    var api = window.__kanban_api;
    if (!api) return;
    var heading = document.getElementById('projects-heading');
    var grid = document.getElementById('projects-grid');
    var form = document.getElementById('add-project-form');
    var input = document.getElementById('field-project-name');
    var errEl = document.getElementById('add-project-error');
    var submitBtn = document.getElementById('btn-add-project-submit');

    api.listProjects().then(function (res) {
      if (!res || !res.projects) { heading.textContent = 'No projects found'; return; }
      var projects = res.projects;
      heading.textContent = projects.length + ' project' + (projects.length !== 1 ? 's' : '');
      grid.innerHTML = '';
      projects.forEach(function (p) {
        var slug = p.slug || p.id;
        var name = p.name || slug;
        grid.insertAdjacentHTML('beforeend',
          '<a href="index.html" class="group rounded-xl border border-border bg-panel p-4 hover:border-borderlt">' +
          '<div class="flex items-start justify-between"><div class="flex items-center gap-2.5 min-w-0">' +
          '<span class="grid place-items-center w-8 h-8 rounded-md bg-accent/15 text-accent shrink-0"><i class="ph-fill ph-folder text-[17px]"></i></span>' +
          '<div class="min-w-0"><h3 class="text-[15px] font-semibold truncate">' + slug + '</h3>' +
          '<p class="mono text-[13px] text-muted">' + (name !== slug ? name : slug) + '</p></div></div></div>' +
          '</a>');
      });
      // Add "add project" button
      grid.insertAdjacentHTML('beforeend',
        '<button type="button" id="btn-add-project" class="rounded-xl border border-dashed border-border bg-transparent p-4 text-muted hover:text-text hover:border-borderlt flex items-center justify-center gap-2 min-h-[148px]">' +
        '<i class="ph ph-plus-circle text-[19px]"></i> <span class="text-[14px]">Add project</span></button>');
      document.getElementById('btn-add-project').addEventListener('click', function () {
        form.classList.remove('hidden');
        input.focus();
      });
    }).catch(function () { heading.textContent = 'Failed to load projects'; });

    // "Add project" → POST /api/projects → open the new project's board.
    // Same slug rules and error surface as the first-run create form.
    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    function slugify(s) {
      return s.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errEl.classList.add('hidden');
      var name = input.value.trim();
      var slug = slugify(name);
      if (!slug) { showError('Enter a project name.'); return; }
      submitBtn.disabled = true;
      api.createProject({ slug: slug, name: name }).then(function (res) {
        if (res && res.project) {
          location.href = '/' + encodeURIComponent(res.project.slug) + '/index.html';
        } else {
          submitBtn.disabled = false;
          showError((res && res.error) || 'Failed to create project.');
        }
      }).catch(function (err) {
        submitBtn.disabled = false;
        showError(String(err));
      });
    });
  })();
</script>
<script src="/shell.js"></script>
</body>
</html>
