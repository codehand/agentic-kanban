<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agentic Kanban - Tasks</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css" />
</head>

<body class="font-sans text-text antialiased h-screen overflow-hidden" data-active="tasks">
<div class="flex h-full">
  <aside id="rail"></aside>

  <main class="flex-1 min-w-0 flex flex-col">
    <!-- top bar -->
    <header class="h-14 shrink-0 border-b border-border bg-panel/80 backdrop-blur flex items-center gap-3 px-4">
      <button class="lg:hidden grid place-items-center w-8 h-8 rounded-md text-muted hover:bg-white/5" aria-label="Open navigation"><i class="ph ph-list text-[19px]"></i></button>
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-[15px] font-semibold tracking-tight">Tasks</span>
        <span class="text-muted text-[13px] hidden sm:inline">Flat list</span>
      </div>

      <div class="ml-auto flex items-center gap-2">
        <div class="hidden md:flex items-center gap-2 rounded-md border border-border bg-panel2 px-2.5 h-9 w-64 text-muted focus-within:border-accent/60">
          <i class="ph ph-magnifying-glass text-[16px]"></i>
          <input id="task-search" aria-label="Search tasks" placeholder="Search key or title" class="bg-transparent text-[13px] text-text placeholder:text-muted outline-none w-full" />
          <kbd class="mono text-[13px] text-muted border border-border rounded px-1">/</kbd>
        </div>

        <label class="flex items-center gap-1.5 rounded-md border border-border bg-panel2 px-2.5 h-9 text-[13px] text-muted">
          <i class="ph ph-funnel text-[15px]"></i>
          <select id="state-filter" aria-label="Filter by state" class="bg-transparent text-[13px] text-text outline-none cursor-pointer">
            <option value="">All states</option>
            <option value="TODO">TODO</option>
            <option value="IN_PROGRESS">IN_PROGRESS</option>
            <option value="IMPLEMENTED">IMPLEMENTED</option>
            <option value="EVIDENCE">EVIDENCE</option>
            <option value="SELF_CHECK_PASSED">SELF_CHECK_PASSED</option>
            <option value="SELF_CHECK_FAILED">SELF_CHECK_FAILED</option>
            <option value="JUDGE_REJECTED">JUDGE_REJECTED</option>
            <option value="JUDGE_PASSED">JUDGE_PASSED</option>
            <option value="DONE">DONE</option>
          </select>
        </label>

        <button id="theme-toggle" aria-label="Toggle theme" class="grid place-items-center w-9 h-9 rounded-md border border-border bg-panel2 text-muted hover:text-text" title="Toggle theme">
          <i class="ph ph-moon text-[16px]"></i>
        </button>
      </div>
    </header>

    <!-- loading / error / empty -->
    <div id="tasks-loading" class="flex-1 grid place-items-center text-muted text-[14px]"><span class="flex items-center gap-2"><i class="ph ph-spinner animate-spin text-[17px]"></i> Loading tasks&hellip;</span></div>
    <div id="tasks-error" class="flex-1 grid place-items-center hidden"><div class="text-center"><p class="text-ev_fail text-[15px] font-medium">Failed to load tasks</p><p class="text-muted text-[13px] mt-1" id="tasks-error-msg"></p><button onclick="loadTasks()" class="mt-3 text-accent text-[13px] hover:underline">Retry</button></div></div>
    <div id="tasks-empty" class="flex-1 grid place-items-center hidden"><div class="text-center"><p class="text-muted text-[15px]">No tasks match</p><p class="text-muted text-[13px] mt-1">Try changing the filter.</p></div></div>

    <!-- table (full width; inner overflow-x keeps narrow viewports from overflowing the page) -->
    <div id="tasks-table-wrap" class="flex-1 overflow-y-auto hidden console-grid">
      <div class="px-4 sm:px-6 py-5 overflow-x-auto">
        <table class="w-full min-w-[560px] text-left border-collapse" role="grid" aria-label="Tasks list">
          <thead>
            <tr class="text-[12px] uppercase tracking-wider text-muted border-b border-border">
              <th scope="col" data-col="key" class="py-2 pr-3 font-medium w-[140px]">
                <button type="button" data-sort="key" class="inline-flex items-center gap-1 hover:text-text">Key <i data-sort-icon class="ph ph-caret-up text-[12px] hidden" aria-hidden="true"></i></button>
              </th>
              <th scope="col" data-col="title" class="py-2 pr-3 font-medium">
                <button type="button" data-sort="title" class="inline-flex items-center gap-1 hover:text-text">Title <i data-sort-icon class="ph ph-caret-up text-[12px] hidden" aria-hidden="true"></i></button>
              </th>
              <th scope="col" data-col="state" class="py-2 pr-3 font-medium w-[170px]">
                <button type="button" data-sort="state" class="inline-flex items-center gap-1 hover:text-text">State <i data-sort-icon class="ph ph-caret-up text-[12px] hidden" aria-hidden="true"></i></button>
              </th>
              <th scope="col" data-col="updated" class="py-2 font-medium w-[110px] text-right">
                <button type="button" data-sort="updated" class="inline-flex items-center gap-1 hover:text-text">Updated <i data-sort-icon class="ph ph-caret-up text-[12px] hidden" aria-hidden="true"></i></button>
              </th>
            </tr>
          </thead>
          <tbody id="tasks-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- ============ TASK DETAIL DRAWER ============ -->
<div id="scrim" class="scrim fixed inset-0 bg-black/50 opacity-0 pointer-events-none z-40" onclick="closeDrawer()"></div>

<aside id="drawer" class="drawer fixed top-0 right-0 h-full w-full sm:w-[520px] bg-panel border-l border-border z-50 translate-x-full flex flex-col" aria-label="Task detail">
  <div class="shrink-0 border-b border-border">
    <div class="flex items-start gap-3 px-5 pt-4">
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <span id="drawer-key" class="mono text-[13px] text-muted"></span>
          <span id="drawer-state-badge" class="inline-flex items-center gap-1 mono text-[13px] px-1.5 py-0.5 rounded"></span>
        </div>
        <h2 id="drawer-title" class="mt-1.5 text-[18px] font-semibold leading-tight tracking-tight"></h2>
        <p class="mt-1 text-[13px] text-muted">in <span id="drawer-project" class="text-text"></span> &middot; updated <span id="drawer-updated" class="mono"></span></p>
      </div>
      <button onclick="closeDrawer()" aria-label="Close drawer" class="grid place-items-center w-8 h-8 rounded-md text-muted hover:bg-white/5 shrink-0"><i class="ph ph-x text-[17px]"></i></button>
    </div>

    <!-- primary action: state-driven (mirrors the board drawer in index.html) -->
    <div class="flex items-center gap-2 px-5 py-3">
      <button id="btn-approve" onclick="confirmApprove()" class="hidden flex items-center gap-2 rounded-md bg-st_human px-3.5 h-9 text-[14px] font-semibold text-white hover:brightness-110 active:translate-y-px glow-human">
        <i class="ph-fill ph-check-circle text-[16px]"></i> Approve &rarr; Done
      </button>
      <button id="btn-reset" onclick="doReset()" class="hidden flex items-center gap-1.5 rounded-md border border-border bg-panel2 px-3 h-9 text-[13px] text-muted hover:text-text hover:border-borderlt">
        <i class="ph ph-arrow-counter-clockwise text-[15px]"></i> Reset
      </button>
      <button id="btn-remove" onclick="doRemove()" aria-label="Remove task (guarded)" class="hidden ml-auto grid place-items-center w-9 h-9 rounded-md border border-border bg-panel2 text-muted hover:text-st_reject hover:border-st_reject/40" title="Remove (guarded)">
        <i class="ph ph-trash text-[15px]"></i>
      </button>
    </div>
  </div>
  <div id="drawer-body" class="flex-1 overflow-y-auto px-5 py-4 space-y-5 text-[14px]">
    <div class="grid place-items-center py-8 text-muted text-[14px]"><span class="flex items-center gap-2"><i class="ph ph-spinner animate-spin text-[17px]"></i> Loading&hellip;</span></div>
  </div>
</aside>

<!-- ============ APPROVE CONFIRM DIALOG (mirrors index.html) ============ -->
<div id="confirm" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/60 p-4">
  <div class="w-full max-w-sm rounded-xl border border-st_human/30 bg-panel glow-human-soft p-5">
    <div class="flex items-center gap-2.5">
      <span class="grid place-items-center w-9 h-9 rounded-lg bg-st_human/15 text-st_human"><i class="ph-fill ph-check-circle text-[19px]"></i></span>
      <h3 id="confirm-title" class="text-[16px] font-semibold">Approve task?</h3>
    </div>
    <p class="mt-3 text-[13px] text-muted leading-relaxed">
      This marks the task <span class="text-text font-medium">DONE</span>. It does <span class="text-text font-medium">not</span> merge the MR. You open and merge each repo's branch yourself.
    </p>
    <div class="mt-3">
      <label class="text-[13px] text-muted">Review note (optional)</label>
      <textarea id="confirm-note" rows="2" class="mt-1 w-full rounded-md border border-border bg-panel2 px-2.5 py-2 text-[13px] text-text placeholder:text-muted outline-none focus:border-accent/60" placeholder="Looks good, merging after release window."></textarea>
    </div>
    <div class="mt-4 flex items-center justify-end gap-2">
      <button onclick="closeConfirm()" class="rounded-md border border-border bg-panel2 px-3 h-9 text-[13px] text-muted hover:text-text">Cancel</button>
      <button onclick="doApprove()" class="flex items-center gap-1.5 rounded-md bg-st_human px-3.5 h-9 text-[13px] font-semibold text-white hover:brightness-110">
        <i class="ph-fill ph-check text-[15px]"></i> Confirm Approve
      </button>
    </div>
  </div>
</div>

<!-- ============ TOAST (mirrors index.html) ============ -->
<div id="toast" class="fixed bottom-4 right-4 z-[70] hidden items-center gap-2 rounded-lg border border-st_done/30 bg-panel px-3.5 py-2.5 text-[13px] shadow-lg">
  <i id="toast-icon" class="ph-fill ph-check-circle text-st_done text-[17px]"></i>
  <span id="toast-msg">Done.</span>
</div>

<script src="/api.js"></script>
<script src="/shell.js"></script>
<script src="/md.js"></script>
<script>
  /* Project scoping: under /<project>/tasks.html only that project's tasks are
   * listed (same pattern as the board). Redirects use the shared helper in
   * shell.js: no prefix -> first project's tasks page, 0 projects -> first-run. */
  (function () {
    'use strict';
    if (window.projectFromPath && !window.projectFromPath() && window.__kanban_api) {
      window.__kanban_api.listProjects().then(function (res) {
        window.redirectToProject('tasks.html', (res && res.projects) || []);
      }).catch(function () {});
    }
  })();
</script>
<script src="/tasks.js"></script>
</body>
</html>
